[pytest]
# strict：async 用例必须显式写 @pytest.mark.asyncio（漏写会报
#   "async def functions are not natively supported"，2026-09-16 实际踩到）。
# ★刻意保持 strict 而**不改成 auto**：改成 auto 会顺带让 integration/e2e 里此前未生效的
#   async 用例开始执行，改变既有测试集合的行为（本次已验证 unit 全绿，但 integration/e2e
#   存在既有环境性失败，无法快速区分因果）——不引入不确定性的做法是**把漏写的装饰器补齐**。
asyncio_mode = strict
pythonpath = .
addopts =
    --ignore=mcpGateway/server_llm_base.py
    --ignore=mcpGateway/sql_server/server_bill.py